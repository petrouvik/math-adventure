<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course - Math Adventure</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/course.css">

    <link rel="manifest" href="manifest.json">

</head>


<body>

    <header>

        <a href="index.html" class="logo">
            <span class="logo-icon" aria-hidden="true">𝕄</span>
            <span class="logo-text">
                <span class="logo-math">Math</span>
                <span class="logo-adventure">Adventure</span>
            </span>
        </a>


        <div class="player-info">

            <div class="level">
                ⭐
                <span class="level-label" data-i18n="home.level"></span>
                <span data-player="level"></span>
            </div>


            <div class="coins">
                🪙
                <span data-player="coins"></span>
            </div>

        </div>

    </header>


    <main class="course-page">

        <a href="learn.html" class="back-link">
            <span class="back-arrow"></span>
            <span data-i18n="course.allCourses"></span>
        </a>


        <section class="course-header-card" id="course-header"></section>


        <section class="course-section">

            <h2 data-i18n="course.lessons"></h2>

            <div class="lesson-list" id="lesson-list"></div>

        </section>

    </main>


    <nav>

        <a href="index.html" class="nav-item">
            <span>🏠</span>
            <span data-i18n="navigation.home"></span>
        </a>


        <a href="learn.html" class="nav-item active">
            <span>📚</span>
            <span data-i18n="navigation.learn"></span>
        </a>


        <a href="progress.html" class="nav-item">
            <span>🏆</span>
            <span data-i18n="navigation.progress"></span>
        </a>


        <a href="shop.html" class="nav-item">
            <span>🎁</span>
            <span data-i18n="navigation.shop"></span>
        </a>

    </nav>


    <script src="js/translations/en.js"></script>
    <script src="js/translations/sr.js"></script>
    <script src="js/i18n.js"></script>

    <script src="js/player.js"></script>
    <script src="js/image-utils.js"></script>
    <script src="js/courses.js"></script>
    <script src="js/course.js"></script>

    <script>

        updatePlayerDisplay();
        renderCourse();
        applyTranslations();

    </script>

    <script src="js/themes.js"></script>
    <script src="js/pwa.js"></script>

</body>

</html>
