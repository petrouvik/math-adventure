<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Math Adventure</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/stats.css">
    <link rel="manifest" href="manifest.json">
</head>


<body>

    <header>

        <div class="logo">
            <span class="logo-icon">🧮</span>
            <span>Math Adventure</span>
        </div>


        <div class="player-info">

            <div class="level">
                ⭐
                <span data-i18n="home.level"></span>
                <span data-player="level"></span>
            </div>


            <div class="coins">
                🪙
                <span data-player="coins"></span>
            </div>

        </div>

    </header>


    <main>

        <section class="welcome">

            <h1 id="welcome-message"></h1>

            <p data-i18n="home.ready"></p>

        </section>


        <section class="xp-card">

            <div class="xp-header">

                <div>

                    <span
                        class="small-label"
                        data-i18n="home.currentLevel"
                    ></span>


                    <h2>
                        ⭐
                        <span data-i18n="home.level"></span>
                        <span data-player="level"></span>
                    </h2>

                </div>


                <span class="xp-text">

                    <span data-player="xp"></span>
                    /
                    <span data-player="nextLevelXP"></span>
                    XP

                </span>

            </div>


            <div class="xp-bar">

                <div
                    class="xp-progress"
                    data-player="xp-progress"
                ></div>

            </div>

        </section>


        <button
            class="continue-button"
            onclick="window.location.href='learn.html'"
        >
            <span class="button-icon">▶</span>
            <span data-i18n="home.continueLearning"></span>
        </button>


        <section class="section">

            <h2 data-i18n="home.todaysProgress"></h2>


            <div class="stats">

                <div class="stat-card">

                    <span class="stat-icon">
                        ⭐
                    </span>


                    <strong class="stat-value">
                        <span data-player="todayXP"></span>
                    </strong>


                    <span
                        class="stat-label"
                        data-i18n="home.xpEarned"
                    ></span>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        🧮
                    </span>


                    <strong class="stat-value">
                        <span data-player="todayProblems"></span>
                    </strong>


                    <span
                        class="stat-label"
                        data-i18n="home.problems"
                    ></span>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        🔥
                    </span>


                    <strong class="stat-value">
                        <span data-player="streak"></span>
                    </strong>


                    <span
                        class="stat-label"
                        data-i18n="home.dayStreak"
                    ></span>

                </div>

            </div>

        </section>
        <section class="section">

            <a
                href="settings.html"
                class="home-settings"
            >

                <div class="home-settings-icon">
                    ⚙️
                </div>


                <div class="home-settings-content">

                    <strong data-i18n="home.settings"></strong>

                    <span data-i18n="home.settingsDescription"></span>

                </div>


                <span class="home-settings-arrow">
                    →
                </span>

            </a>

        </section>

    </main>


    <nav>

        <a
            href="index.html"
            class="nav-item active"
        >
            <span>🏠</span>
            <span data-i18n="navigation.home"></span>
        </a>


        <a
            href="learn.html"
            class="nav-item"
        >
            <span>📚</span>
            <span data-i18n="navigation.learn"></span>
        </a>


        <a
            href="progress.html"
            class="nav-item"
        >
            <span>🏆</span>
            <span data-i18n="navigation.progress"></span>
        </a>


        <a
            href="shop.html"
            class="nav-item"
        >
            <span>🎁</span>
            <span data-i18n="navigation.shop"></span>
        </a>

    </nav>


    <script src="js/translations/en.js"></script>
    <script src="js/translations/sr.js"></script>
    <script src="js/i18n.js"></script>

    <script src="js/player.js"></script>

    <script>

        updatePlayerDisplay();

        const player = getPlayer();

        document.getElementById("welcome-message").textContent =
            tf("home.welcome", {
                name: player.name
            });

        applyTranslations();

    </script>

    <script src="js/themes.js"></script>
    <script src="js/pwa.js"></script>

</body>

</html>
