<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Math Adventure</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            <span class="logo-icon">🧮</span>
            <span>Math Adventure</span>
        </div>

        <div class="player-info">
            <div class="level">
                ⭐ Level <span data-player="level"></span>
            </div>

            <div class="coins">
                🪙 <span data-player="coins"></span>
            </div>
        </div>
    </header>


    <main>

        <section class="welcome">
            <h1>Hello, <span data-player="name"></span>! 👋</h1>

            <p>
                Ready for another math adventure?
            </p>
        </section>


        <section class="xp-card">

            <div class="xp-header">
                <div>
                    <span class="small-label">
                        Current Level
                    </span>

                    <h2>⭐ Level <span data-player="level"></h2>
                </div>

                <span class="xp-text">
                    <span data-player="xp"></span> / <span data-player="nextLevelXP"></span> XP
                </span>
            </div>


            <div class="xp-bar">
                <div class="xp-progress" data-player="xp-progress"></div>
            </div>

        </section>


        <button class="continue-button">
            <span class="button-icon">▶</span>

            Continue Learning
        </button>


        <section class="section">

            <h2>Today's Progress</h2>


            <div class="stats">

                <div class="stat-card">

                    <span class="stat-icon">
                        ⭐
                    </span>

                    <strong class="stat-value">
                        <span data-player="xp"></span>
                    </strong>

                    <span class="stat-label">XP Earned</span>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        🧮
                    </span>

                    <strong class="stat-value">
                        <span data-player="problems"></span>
                    </strong>

                    <span class="stat-label">Problems</span>

                </div>

                <div class="stat-card">

                    <span class="stat-icon">
                        🔥
                    </span>

                    <strong class="stat-value">
                        <span data-player="streak"></span>
                    </strong>

                    <span class="stat-label">Day Streak</span>

                </div>

            </div>

        </section>


        

    </main>


    <nav>

        <a href="index.html" class="nav-item active">
            <span>🏠</span>
            Home
        </a>

        <a href="learn.html" class="nav-item">
            <span>📚</span>
            Learn
        </a>

        <a href="progress.html" class="nav-item">
            <span>🏆</span>
            Progress
        </a>

        <a href="shop.html" class="nav-item">
            <span>🎁</span>
            Shop
        </a>

    </nav>
    <script src="js/player.js"></script>
    <script>
        updatePlayerDisplay();
    </script>

</body>
</html>
