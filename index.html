<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Math Adventure</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            <span class="logo-icon">🧮</span>
            <span>Math Adventure</span>
        </div>

        <div class="player-info">
            <div class="level">
                ⭐ Level 3
            </div>

            <div class="coins">
                🪙 125
            </div>
        </div>
    </header>


    <main>

        <section class="welcome">
            <h1>Hello, Alex! 👋</h1>

            <p>
                Ready for another math adventure?
            </p>
        </section>


        <section class="xp-card">

            <div class="xp-header">
                <div>
                    <span class="small-label">
                        Current Level
                    </span>

                    <h2>⭐ Level 3</h2>
                </div>

                <span class="xp-text">
                    240 / 300 XP
                </span>
            </div>


            <div class="xp-bar">
                <div class="xp-progress"></div>
            </div>

        </section>


        <button class="continue-button">
            <span class="button-icon">▶</span>

            Continue Learning
        </button>


        <section class="section">

            <h2>Today's Progress</h2>


            <div class="stats">

                <div class="stat-card">

                    <span class="stat-icon">
                        ⭐
                    </span>

                    <strong>120</strong>

                    <span>XP Earned</span>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        🧮
                    </span>

                    <strong>15</strong>

                    <span>Problems</span>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        🔥
                    </span>

                    <strong>4</strong>

                    <span>Day Streak</span>

                </div>

            </div>

        </section>


        <section class="section">

            <h2>🎯 Daily Challenge</h2>


            <div class="challenge-card">

                <div class="challenge-info">

                    <div class="challenge-icon">
                        🎯
                    </div>

                    <div>
                        <h3>
                            Solve 10 problems!
                        </h3>

                        <p>
                            Earn bonus coins by completing
                            today's challenge.
                        </p>
                    </div>

                </div>


                <div class="challenge-progress">

                    <div class="challenge-bar">
                        <div class="challenge-fill"></div>
                    </div>

                    <span>
                        6 / 10
                    </span>

                </div>

            </div>

        </section>

    </main>


    <nav>

        <button class="nav-item active">
            <span>🏠</span>
            Home
        </button>

        <button class="nav-item">
            <span>📚</span>
            Learn
        </button>

        <button class="nav-item">
            <span>🏆</span>
            Progress
        </button>

        <button class="nav-item">
            <span>🎁</span>
            Shop
        </button>

    </nav>

</body>
</html>
