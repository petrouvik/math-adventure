<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Math Adventure</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/stats.css">
    <link rel="manifest" href="manifest.json">
</head>


<body>

    <header>

        <a href="index.html" class="logo">
            <span class="logo-icon" aria-hidden="true">𝕄</span>
            <span class="logo-text">
                <span class="logo-math">Math</span>
                <span class="logo-adventure">Adventure</span>
            </span>
        </a>


        <div class="player-info">

            <div class="level">
                ⭐
                <span class="level-label" data-i18n="home.level"></span>
                <span data-player="level"></span>
            </div>


            <div class="coins">
                🪙
                <span data-player="coins"></span>
            </div>

        </div>

    </header>


    <main>

        <section class="welcome">

            <h1 id="welcome-message"></h1>

            <p data-i18n="home.ready"></p>

        </section>


        <section class="xp-card">

            <div class="xp-header">

                <div>

                    <span class="small-label" data-i18n="home.currentLevel"></span>


                    <h2>
                        ⭐
                        <span data-i18n="home.level"></span>
                        <span data-player="level"></span>
                    </h2>

                </div>


                <span class="xp-text">

                    <span data-player="xp"></span>
                    /
                    <span data-player="nextLevelXP"></span>
                    XP

                </span>

            </div>


            <div class="xp-bar">

                <div class="xp-progress" data-player="xp-progress"></div>

            </div>

        </section>


        <button class="continue-button" onclick="window.location.href='learn.html'">
            <span class="button-icon"></span>
            <span data-i18n="home.continueLearning"></span>
        </button>


        <section class="section">

            <h2 data-i18n="home.todaysProgress"></h2>


            <div class="stats">

                <div class="stat-card">

                    <span class="stat-icon">
                        ⭐
                    </span>


                    <strong class="stat-value">
                        <span data-player="todayXP"></span>
                    </strong>


                    <span class="stat-label" data-i18n="home.xpEarned"></span>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        🧮
                    </span>


                    <strong class="stat-value">
                        <span data-player="todayProblems"></span>
                    </strong>


                    <span class="stat-label" data-i18n="home.problems"></span>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        🔥
                    </span>


                    <strong class="stat-value">
                        <span data-player="streak"></span>
                    </strong>


                    <span class="stat-label" data-i18n="home.dayStreak"></span>

                </div>

            </div>

        </section>
        <section class="section">

            <a href="settings.html" class="home-settings">

                <div class="home-settings-icon">
                    ⚙️
                </div>


                <div class="home-settings-content">

                    <strong data-i18n="home.settings"></strong>

                    <span data-i18n="home.settingsDescription"></span>

                </div>


                <span class="home-settings-arrow">
                    →
                </span>

            </a>

        </section>
        <footer class="credits">

            <p id="credits-made"></p>

            <div class="credits-links">

                <a href="https://github.com/petrouvik/math-adventure" class="credits-link" target="_blank"
                    rel="noopener noreferrer">

                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <path
                            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
                    </svg>

                    <span data-i18n="home.sourceCode"></span>

                </a>

                <span class="credits-version" id="app-version"></span>

            </div>

        </footer>

    </main>


    <nav>

        <a href="index.html" class="nav-item active">
            <span>🏠</span>
            <span data-i18n="navigation.home"></span>
        </a>


        <a href="learn.html" class="nav-item">
            <span>📚</span>
            <span data-i18n="navigation.learn"></span>
        </a>


        <a href="progress.html" class="nav-item">
            <span>🏆</span>
            <span data-i18n="navigation.progress"></span>
        </a>


        <a href="shop.html" class="nav-item">
            <span>🎁</span>
            <span data-i18n="navigation.shop"></span>
        </a>

    </nav>


    <script src="js/translations/en.js"></script>
    <script src="js/translations/sr.js"></script>
    <script src="js/i18n.js"></script>

    <script src="js/player.js"></script>

    <script>

        updatePlayerDisplay();

        const player = getPlayer();

        document.getElementById("welcome-message").textContent =
            tf("home.welcome", {
                name: player.name
            });

        document.getElementById("credits-made").textContent =
            tf("home.madeBy", {
                author: "Your Name"
            });

        document.getElementById("app-version").textContent =
            tf("home.version", {
                version: "1.0.0"
            });

        applyTranslations();

    </script>

    <script src="js/themes.js"></script>
    <script src="js/pwa.js"></script>

</body>

</html>
