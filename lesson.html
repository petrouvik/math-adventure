<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adding to 20 - Math Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-bar">
        <div class="logo">🧮 Math Adventure</div>

        <div class="player-info">
            <span>⭐ Level 3</span>
            <span>🪙 125</span>
        </div>
    </header>


    <main class="lesson-page">

        <a href="course.html" class="back-link">← Addition</a>

        <div class="lesson-header">
            <div>
                <p class="lesson-label">Lesson 3</p>
                <h1>Adding to 20</h1>
            </div>

            <span class="lesson-count">3 / 10</span>
        </div>


        <!-- Lesson progress -->
        <div class="lesson-progress-bar">
            <div
                class="lesson-progress-fill"
                style="width: 30%;"
            ></div>
        </div>


        <!-- Problem -->
        <section class="problem-card">

            <p class="problem-instruction">
                What is the answer?
            </p>

            <div class="problem">
                <span>7 + 5</span>
                <span>=</span>
                <span class="question-mark">?</span>
            </div>

            <div class="answer-area">
                <input
                    type="number"
                    class="answer-input"
                    placeholder="?"
                    aria-label="Your answer"
                >

                <button class="check-button">
                    Check Answer
                </button>
            </div>

        </section>


        <!-- Example explanation.
             This would normally be hidden until the
             student submits an incorrect answer. -->
        <section class="explanation-card">

            <div class="explanation-icon">💡</div>

            <div>
                <h2>Let's solve it together!</h2>

                <p>Start with <strong>7</strong>.</p>

                <p>Count <strong>5</strong> more:</p>

                <div class="counting">
                    <span>8</span>
                    <span>→</span>
                    <span>9</span>
                    <span>→</span>
                    <span>10</span>
                    <span>→</span>
                    <span>11</span>
                    <span>→</span>
                    <span>12</span>
                </div>

                <p>
                    So <strong>7 + 5 = 12</strong>.
                </p>
            </div>

        </section>


        <!-- Next button -->
        <button class="next-button">
            Next Problem →
        </button>

    </main>


    <nav class="bottom-nav">
        <a href="index.html">
            🏠
            <span>Home</span>
        </a>

        <a href="learn.html" class="active">
            📚
            <span>Learn</span>
        </a>

        <a href="progress.html">
            🏆
            <span>Progress</span>
        </a>

        <a href="shop.html">
            🎨
            <span>Shop</span>
        </a>
    </nav>

</body>
</html>
