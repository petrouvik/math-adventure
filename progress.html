<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Progress - Math Adventure</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/progress.css">
    <link rel="stylesheet" href="css/stats.css">
</head>

<body>

    <header>

        <div class="logo">
            <span class="logo-icon">🧮</span>
            <span>Math Adventure</span>
        </div>

        <div class="player-info">

            <div class="level">
                ⭐ Level <span data-player="level"></span>
            </div>

            <div class="coins">
                🪙 <span data-player="coins"></span>
            </div>

        </div>

    </header>


    <main>

        <!-- PAGE HEADER -->

        <section class="page-header">

            <h1>🏆 Your Progress</h1>

            <p>
                Look how far you've come!
            </p>

        </section>


        <!-- LEVEL / XP -->

        <section class="level-card">

            <div class="level-card-top">

                <div>

                    <span class="small-label">
                        Current Level
                    </span>

                    <h2>
                        ⭐ Level <span data-player="level"></span>
                    </h2>

                </div>

                <div class="total-xp">

                    <strong>
                        <span data-player="xp"></span>
                    </strong>

                    <span>Total XP</span>

                </div>

            </div>


            <div class="xp-bar">

                <div
                    class="xp-progress"
                    data-player="xp-progress"
                ></div>

            </div>


            <p class="next-level">

                🚀 Only
                <span data-player="xpUntilNext"></span>
                XP until Level
                <span data-player="nextLevel"></span>!

            </p>

        </section>


        <!-- LEARNING PROGRESS -->

        <section class="section">

            <h2>📚 Learning Progress</h2>

            <div
                class="course-list"
                id="course-progress"
            ></div>

        </section>


        <!-- ACHIEVEMENTS -->

        <section class="section">

            <h2>🏅 Achievements</h2>

            <div
                class="achievements"
                id="achievement-progress"
            ></div>

            <button
                class="show-more-button"
                id="achievement-show-more"
            >
                Show more
            </button>

        </section>


        <!-- SMALL STATS -->

        <section class="section">

            <h2>📊 Your Stats</h2>

            <div class="stats">

                <div class="stat-card">

                    <span class="stat-icon">
                        ⭐
                    </span>

                    <strong class="stat-value">
                        <span data-player="xp"></span>
                    </strong>

                    <span class="stat-label">
                        XP Earned
                    </span>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        🧮
                    </span>

                    <strong class="stat-value">
                        <span data-player="problems"></span>
                    </strong>

                    <span class="stat-label">
                        Problems
                    </span>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        🔥
                    </span>

                    <strong class="stat-value">
                        <span data-player="streak"></span>
                    </strong>

                    <span class="stat-label">
                        Day Streak
                    </span>

                </div>

            </div>

        </section>

    </main>


    <nav>

        <a href="index.html" class="nav-item">
            <span>🏠</span>
            Home
        </a>

        <a href="learn.html" class="nav-item">
            <span>📚</span>
            Learn
        </a>

        <a href="progress.html" class="nav-item active">
            <span>🏆</span>
            Progress
        </a>

        <a href="shop.html" class="nav-item">
            <span>🎁</span>
            Shop
        </a>

    </nav>


    <script src="js/player.js"></script>
    <script src="js/courses.js"></script>
    <script src="js/course.js"></script>
    <script src="js/achievements.js"></script>
    <script src="js/progress.js"></script>

</body>

</html>
