<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Progress - Math Adventure</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/progress.css">
    <link rel="stylesheet" href="css/stats.css">
</head>


<body>

    <header>

        <div class="logo">
            <span class="logo-icon">🧮</span>
            <span>Math Adventure</span>
        </div>


        <div class="player-info">

            <div class="level">
                ⭐
                <span data-i18n="progress.level"></span>
                <span data-player="level"></span>
            </div>


            <div class="coins">
                🪙
                <span data-player="coins"></span>
            </div>

        </div>

    </header>


    <main>

        <!-- PAGE HEADER -->

        <section class="page-header">

            <h1 data-i18n="progress.title"></h1>

            <p data-i18n="progress.subtitle"></p>

        </section>


        <!-- LEVEL / XP -->

        <section class="level-card">

            <div class="level-card-top">

                <div>

                    <span
                        class="small-label"
                        data-i18n="progress.currentLevel"
                    ></span>


                    <h2>
                        ⭐
                        <span data-i18n="progress.level"></span>
                        <span data-player="level"></span>
                    </h2>

                </div>


                <div class="total-xp">

                    <strong>
                        <span data-player="xp"></span>
                    </strong>

                    <span data-i18n="progress.totalXP"></span>

                </div>

            </div>


            <div class="xp-bar">

                <div
                    class="xp-progress"
                    data-player="xp-progress"
                ></div>

            </div>


            <p class="next-level">

                🚀
                <span data-i18n="progress.xpUntilNextPrefix"></span>

                <span data-player="xpUntilNext"></span>

                <span data-i18n="progress.xpUntilNextMiddle"></span>

                <span data-player="nextLevel"></span>!

            </p>

        </section>


        <!-- LEARNING PROGRESS -->

        <section class="section">

            <h2 data-i18n="progress.learningProgress"></h2>

            <div
                class="course-list"
                id="course-progress"
            ></div>

        </section>


        <!-- ACHIEVEMENTS -->

        <section class="section">

            <h2 data-i18n="progress.achievements"></h2>

            <div
                class="achievements"
                id="achievement-progress"
            ></div>


            <button
                class="show-more-button"
                id="achievement-show-more"
                data-i18n="progress.showMore"
            ></button>

        </section>


        <!-- SMALL STATS -->

        <section class="section">

            <h2 data-i18n="progress.yourStats"></h2>


            <div class="stats">

                <div class="stat-card">

                    <span class="stat-icon">
                        ⭐
                    </span>


                    <strong class="stat-value">
                        <span data-player="xp"></span>
                    </strong>


                    <span
                        class="stat-label"
                        data-i18n="progress.xpEarned"
                    ></span>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        🧮
                    </span>


                    <strong class="stat-value">
                        <span data-player="problems"></span>
                    </strong>


                    <span
                        class="stat-label"
                        data-i18n="progress.problems"
                    ></span>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        🔥
                    </span>


                    <strong class="stat-value">
                        <span data-player="streak"></span>
                    </strong>


                    <span
                        class="stat-label"
                        data-i18n="progress.dayStreak"
                    ></span>

                </div>

            </div>

        </section>

    </main>


    <nav>

        <a
            href="index.html"
            class="nav-item"
        >
            <span>🏠</span>
            <span data-i18n="navigation.home"></span>
        </a>


        <a
            href="learn.html"
            class="nav-item"
        >
            <span>📚</span>
            <span data-i18n="navigation.learn"></span>
        </a>


        <a
            href="progress.html"
            class="nav-item active"
        >
            <span>🏆</span>
            <span data-i18n="navigation.progress"></span>
        </a>


        <a
            href="shop.html"
            class="nav-item"
        >
            <span>🎁</span>
            <span data-i18n="navigation.shop"></span>
        </a>

    </nav>


    <script src="js/translations/en.js"></script>
    <script src="js/translations/sr.js"></script>
    <script src="js/i18n.js"></script>

    <script src="js/player.js"></script>
    <script src="js/image-utils.js"></script>
    <script src="js/courses.js"></script>
    <script src="js/course.js"></script>
    <script src="js/achievements.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/themes.js"></script>
    <script>
        applyTranslations();
    </script>

</body>

</html>
