<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shop - Math Adventure</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/shop.css">

</head>

<body>

    <header>

        <div class="logo">
            <span class="logo-icon">🧮</span>
            <span>Math Adventure</span>
        </div>


        <div class="player-info">
            <div class="level">
                ⭐ Level <span data-player="level"></span>
            </div>

            <div class="coins">
                🪙 <span data-player="coins"></span>
            </div>
        </div>

    </header>


    <main>

        <!-- PAGE HEADER -->

        <section class="page-header">

            <h1>🎨 Theme Shop</h1>

            <p>
                Customize your Math Adventure!
            </p>

        </section>


        <!-- COIN BALANCE -->

        <section class="shop-balance">

            <span class="balance-icon">🪙</span>

            <div>

                <span class="balance-label">
                    Your Coins
                </span>

                <strong>
                    <span data-player="coins"></span>
                </strong>

            </div>

        </section>


        <section class="section">

            <h2>✨ Themes</h2>

            <div class="theme-grid" id="theme-list"></div>

        </section>


        <nav>

        <a href="index.html" class="nav-item">
            <span>🏠</span>
            Home
        </a>

        <a href="learn.html" class="nav-item">
            <span>📚</span>
            Learn
        </a>

        <a href="progress.html" class="nav-item">
            <span>🏆</span>
            Progress
        </a>

        <a href="shop.html" class="nav-item active">
            <span>🎁</span>
            Shop
        </a>

    </nav>

    </main>
    <script src="js/player.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/shop.js"></script>

</body>
</html>
