<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shop - Math Adventure</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/shop.css">
    <link rel="manifest" href="manifest.json">

</head>


<body>

    <header>

        <div class="logo">
            <span class="logo-icon">🧮</span>
            <span>Math Adventure</span>
        </div>


        <div class="player-info">

            <div class="level">
                ⭐
                <span data-i18n="shop.level"></span>
                <span data-player="level"></span>
            </div>


            <div class="coins">
                🪙
                <span data-player="coins"></span>
            </div>

        </div>

    </header>


    <main>

        <!-- PAGE HEADER -->

        <section class="page-header">

            <h1 data-i18n="shop.title"></h1>

            <p data-i18n="shop.subtitle"></p>

        </section>


        <!-- COIN BALANCE -->

        <section class="shop-balance">

            <span class="balance-icon">🪙</span>


            <div>

                <span
                    class="balance-label"
                    data-i18n="shop.yourCoins"
                ></span>


                <strong>
                    <span data-player="coins"></span>
                </strong>

            </div>

        </section>


        <section class="section">

            <h2 data-i18n="shop.themes"></h2>

            <div
                class="theme-grid"
                id="theme-list"
            ></div>

        </section>

    </main>


    <nav>

        <a
            href="index.html"
            class="nav-item"
        >
            <span>🏠</span>
            <span data-i18n="navigation.home"></span>
        </a>


        <a
            href="learn.html"
            class="nav-item"
        >
            <span>📚</span>
            <span data-i18n="navigation.learn"></span>
        </a>


        <a
            href="progress.html"
            class="nav-item"
        >
            <span>🏆</span>
            <span data-i18n="navigation.progress"></span>
        </a>


        <a
            href="shop.html"
            class="nav-item active"
        >
            <span>🎁</span>
            <span data-i18n="navigation.shop"></span>
        </a>

    </nav>


    <script src="js/translations/en.js"></script>
    <script src="js/translations/sr.js"></script>
    <script src="js/i18n.js"></script>

    <script src="js/player.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/shop.js"></script>
    <script>
        applyTranslations();
    </script>
    <script src="js/pwa.js"></script>

</body>

</html>
